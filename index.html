<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--panel:#fbfbfc;--ink:#1a2030;--mut:#6a7286;--line:#d8dce4;--acc:#1d4ed8;--grid:#e3e6ec;--lt:#1a2030}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1b1f27;--ink:#e6e9f0;--mut:#8b93a7;--line:#2c3240;--acc:#6ea0ff;--grid:#252a35;--lt:#e6e9f0}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1b1f27;--ink:#e6e9f0;--mut:#8b93a7;--line:#2c3240;--acc:#6ea0ff;--grid:#252a35;--lt:#e6e9f0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}

@media(max-width:860px){#app{grid-template-columns:58px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 40% auto;grid-template-areas:"h h" "t m" "a a" "s s"}}
header{grid-area:h;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:15px;letter-spacing:.2px}
header label{display:flex;gap:5px;align-items:center;color:var(--mut)}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
input[type=number]{width:100%}
#tools{grid-area:t;display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line)}
#tools button{display:flex;flex-direction:column;align-items:center;padding:6px 0;font-size:10px;gap:1px}
#tools button span{font-size:18px;line-height:1}
#views{grid-area:m;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);min-height:0}
#views.m2{grid-template-columns:1fr}#views.m2 #v3{display:none}
#views.m3{grid-template-columns:1fr}#views.m3 #v2{display:none}
@media(max-width:860px){#views{grid-template-columns:1fr;grid-template-rows:1fr 1fr}#views.m2,#views.m3{grid-template-rows:1fr}}
#views section{position:relative;background:var(--panel);min-height:0;min-width:0}
.tag{position:absolute;right:8px;top:6px;color:var(--mut);font-size:11px;pointer-events:none}
svg,canvas{display:block;width:100%;height:100%;touch-action:none}
svg.t-sel{cursor:default}svg.t-add{cursor:crosshair}
.g{stroke:var(--grid);fill:none}.lt{stroke:var(--lt);stroke-width:1.6}
.cap{fill:var(--mut);font-size:11px}.lb{font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.ref{stroke:var(--mut);stroke-dasharray:3 4;opacity:.7}.dm{fill:var(--mut);font-size:10.5px;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.dl{stroke:var(--mut);opacity:.8}
.qk{font-size:10.5px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.qleg{position:absolute;left:8px;right:8px;top:30px;display:flex;font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2;text-align:center}
.qleg>div{flex:1;padding:5px 4px;border-left:1px solid var(--line)}.qleg>div:first-child{border-left:0}
.qleg small{display:block;color:var(--mut);font-weight:400;margin-top:1px}
.qleg.hidden{display:none}
.tools3{position:absolute;left:8px;top:6px;z-index:2;display:flex;gap:4px}
.tools3 button{padding:4px 7px}
aside{grid-area:a;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:4px 10px}
@media(max-width:860px){aside{border-left:0;border-top:1px solid var(--line)}}
details{border-bottom:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:5px;margin:4px 0}.row>*{flex:1}.row button{flex:0 0 auto}
aside label{display:block;color:var(--mut);margin:4px 0}aside label input{margin-top:2px;width:100%;box-sizing:border-box}
small{color:var(--mut)}
.ob{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:6px;cursor:pointer}
.ob.on{background:var(--bg);outline:1px solid var(--acc)}.ob i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.ob span{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ob button{padding:0 6px;border:0;background:none}
footer{grid-area:s;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);min-height:1.4em}
</style></head>
<body>
<div id="app">
<header>
 <b>Diédrico 2D ⇄ 3D</b>
 <span><button id="und" title="Deshacer (Ctrl+Z)">↶</button> <button id="red" title="Rehacer (Ctrl+Y)">↷</button></span>
 <span id="modes"><button data-m="" class="on">2D + 3D</button> <button data-m="m2">Solo 2D</button> <button data-m="m3">Solo 3D</button></span>
 <label><input type="checkbox" id="snap" checked>Rejilla de 5</label>

 <button data-t="sel" class="on" title="Seleccionar y arrastrar (V)"><span>↖</span>Mover</button>

<main id="views">
 <section id="v2"><div class="tag">Alzado arriba · Planta abajo</div><div id="qleg" class="qleg hidden"></div><svg id="svg" class="t-sel"></svg></section>
 <section id="v3"><div class="tag">Arrastra para girar · rueda para zoom</div>
  <div class="tools3">
   <button data-t3="orbit" class="on" title="Orbitar (arrastra para girar)">🧭</button>
   <button data-t3="pt3" title="Punto en el espacio (clic sobre el plano PH)">•</button>
   <button data-t3="ln3" title="Recta en el espacio (clic en 2 puntos)">╱</button>
  </div>
  <canvas id="cv"></canvas></section>
</main>
<aside>
 <details open><summary>Punto por coordenadas</summary>
  <div class="row"><input id="nx" type="number" value="0" aria-label="x"><input id="ny" type="number" value="30" aria-label="y"><input id="nz" type="number" value="30" aria-label="z"><button id="addp">Añadir</button></div>
  <small>x sobre la LT · y alejamiento · z cota</small></details>
 <details open><summary>Añadir por tipo</summary>
  <select id="ct" style="width:100%"></select>
  <div class="row"><select id="ca"></select><select id="cb"></select><select id="cc"></select></div>
  <button id="mk">Crear</button></details>
 <details open><summary>Propiedades</summary><div id="props"></div></details>
 <details open><summary>Objetos</summary><div id="objs"></div></details>
</aside>
<footer id="st"></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= GUÍA RÁPIDA DE ARQUITECTURA =================
 Modelo: cada objeto vive en objs[] con {id,kind,t,refs,v,name,c,hide,geo}.
   kind: 'pt'|'ln'|'pl' (qué es).  t: la "receta" concreta (ver calc()).
   refs: ids de otros objetos de los que depende (grafo de dependencias).
   v: sólo para puntos libres (t==='free'), sus coords {x,y,z} editables.
   geo: caché calculada por compute(): pt→[x,y,z], ln→{p,d}, pl→{p,n}.
 Flujo de datos (unidireccional): editar v de un punto libre → compute()
   recorre objs y recalcula geo de todos vía calc(o,R) usando refs → esa
   misma geo alimenta el SVG (draw2d) y Three.js (buildScene). No hay
   estado duplicado: 2D y 3D son sólo "vistas" de objs.
 Añadir una construcción nueva:
   1) nuevo case en calc() (recibe R=[geo_de_cada_ref] en el orden de refs)
   2) entrada en CONS: {n:'texto menú',a:'pt'|'ln'|'pl',b:...,c:...,k:'pt'|'ln'|'pl'}
      (a/b/c = tipos de las hasta 3 referencias que pide el panel Construir;
      k = tipo de objeto que produce). Se auto-registra en el desplegable.
   3) opcional: entrada en DESC para el texto corto en el panel de Objetos.
   calc() debe devolver null si la construcción es degenerada (paralelismos,
   puntos alineados, rectas que se cruzan...); el panel Construir comprueba
   el resultado ANTES de crear el objeto y no deja crear nada si es null.
 Convenio diédrico: x = abscisa (posición sobre LT), y = alejamiento
   (planta, hacia abajo en el SVG), z = cota (alzado, hacia arriba).
   Cuadrantes: 1(y≥0,z≥0) 2(y<0,z≥0) 3(y<0,z<0) 4(y≥0,z<0); con el
   interruptor "Cuadrantes" activo, sólo el tramo en el 1er cuadrante se
   dibuja continuo y el resto discontinuo (función quadDraw en draw2d).
 3D: T(x,y,z) convierte coords diédricas a THREE.Vector3 (Y_three=z,
   Z_three=y). Las esferas de puntos llevan userData.pointId para poder
   seleccionarlas con el Raycaster (pick3D) al crear rectas en el espacio.
================================================================= */
const $=s=>document.querySelector(s);
const PAL=['#3b82f6','#ef4444','#10b981','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316'];
const P1='′',P2='″',fmt=n=>Math.round(n*10)/10,f2=n=>(Math.round(n*100)/100);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a);return l<1e-9?null:a.map(c=>c/l)};
/* Intersección de dos planos {p,n}: devuelve {p,d} o null si son paralelos. */
function planeInter(A,B){
 const dir=norm(cross(A.n,B.n));if(!dir)return null;
 const d1=dot(A.n,A.p),d2=dot(B.n,B.p);
 const ax=[0,1,2].reduce((a,b)=>Math.abs(dir[b])>Math.abs(dir[a])?b:a,0),[i0,i1]=[0,1,2].filter(i=>i!==ax);
 const a11=A.n[i0],a12=A.n[i1],a21=B.n[i0],a22=B.n[i1],det=a11*a22-a12*a21;if(Math.abs(det)<1e-9)return null;
 const p=[0,0,0];p[ax]=0;p[i0]=(d1*a22-d2*a12)/det;p[i1]=(a11*d2-a21*d1)/det;
 return{p,d:dir}}
const KLABEL={pt:'punto',ln:'recta',pl:'plano'};
const QCOL=['','#2563eb','#059669','#d97706','#db2777'],QROM=['','I','II','III','IV'];
const quadNum=(y,z)=>y>=0?(z>=0?1:4):(z>=0?2:3);
let objs=[],nid=1,cnt={pt:0,ln:0,pl:0},sel=null,pending=[],tool='sel',tool3='orbit',pending3=[],hist=[],fut=[],drag=null,pan=null,msg='';
const V={ox:0,oy:0,s:3,init:0};
const byId=id=>objs.find(o=>o.id===id);

/* ---------- Modelo: todo vive en 3D, el diédrico es proyección ---------- */
function calc(o,R){
 const t=o.t,P=R[0],Q=R[1];
 switch(t){
 case 'free':return[o.v.x,o.v.y,o.v.z];
 case 'mid':return P.map((c,i)=>(c+Q[i])/2);
 case 'inter':{const den=dot(Q.n,P.d);if(Math.abs(den)<1e-9)return null;const k=dot(Q.n,sub(Q.p,P.p))/den;return P.p.map((c,i)=>c+k*P.d[i])}
 case 'l2':{const d=norm(sub(Q,P));return d&&{p:P,d}}
 case 'lpar':return{p:P,d:Q.d};
 case 'lperp':return{p:P,d:Q.n};
 case 'llt':return{p:P,d:[1,0,0]};
 case 'lvert':return{p:P,d:[0,0,1]};
 case 'lpunta':return{p:P,d:[0,1,0]};
 case 'lhor':{if(Math.abs(P[2]-Q[2])>1e-6)return null;const d=norm(sub(Q,P));return d&&{p:P,d:[d[0],d[1],0]}}
 case 'lfront':{if(Math.abs(P[1]-Q[1])>1e-6)return null;const d=norm(sub(Q,P));return d&&{p:P,d:[d[0],0,d[2]]}}
 case 'lperf':{if(Math.abs(P[0]-Q[0])>1e-6)return null;const d=norm(sub(Q,P));return d&&{p:P,d:[0,d[1],d[2]]}}
 case 'p3':{const n=norm(cross(sub(Q,P),sub(R[2],P)));return n&&{p:P,n}}
 case 'phor':return{p:P,n:[0,0,1]};
 case 'pfront':return{p:P,n:[0,1,0]};
 case 'pperf':return{p:P,n:[1,0,0]};
 case 'bis1':return{p:[0,0,0],n:norm([0,1,-1])};
 case 'bis2':return{p:[0,0,0],n:norm([0,1,1])};
 case 'pperp':return{p:P,n:Q.d};
 case 'ppar':return{p:P,n:Q.n};
 case 'pp2':return planeInter(P,Q);
 case 'pl_lp':{const n=norm(cross(P.d,sub(Q,P.p)));return n&&{p:P.p,n}}
 case 'pl_ll':{let n=norm(cross(P.d,Q.d));
  if(n)return Math.abs(dot(sub(Q.p,P.p),n))>1e-6?null:{p:P.p,n};
  const n2=norm(cross(P.d,sub(Q.p,P.p)));return n2&&{p:P.p,n:n2}}
 case 'pltl_pp':{const n=norm(cross([1,0,0],sub(Q,P)));return n&&{p:P,n}}
 case 'pltl_pl':{const n=norm(cross([1,0,0],P.d));return n&&{p:P.p,n}}
 case 'proj':{const k=(dot(Q.n,P)-dot(Q.n,Q.p))/dot(Q.n,Q.n);return P.map((c,i)=>c-k*Q.n[i])}
 case 'projl':{const k=dot(sub(P,Q.p),Q.d)/dot(Q.d,Q.d);return Q.p.map((c,i)=>c+k*Q.d[i])}
 case 'symp':return P.map((c,i)=>2*Q[i]-c);
 }}
function compute(){for(const o of objs){const R=o.refs.map(i=>{const r=byId(i);return r&&r.geo});o.geo=R.some(g=>!g)?null:calc(o,R)}}
function add(kind,t,refs,v){
 const c=cnt[kind]++;
 const name=kind==='pt'?String.fromCharCode(65+c%26)+(c>=26?Math.floor(c/26):''):kind==='ln'?'rstuvw'[c%6]+(c>=6?Math.floor(c/6):''):'αβγδεζηθ'[c%8]+(c>=8?Math.floor(c/8):'');
 const o={id:nid++,kind,t,refs,v,name,hide:0};o.c=PAL[o.id%PAL.length];objs.push(o);compute();return o}
function del(id){snap();const rm=new Set([id]);let ch=1;while(ch){ch=0;for(const o of objs)if(!rm.has(o.id)&&o.refs.some(r=>rm.has(r))){rm.add(o.id);ch=1}}
 objs=objs.filter(o=>!rm.has(o.id));if(rm.has(sel))sel=null;pending=pending.filter(x=>!rm.has(x));compute();render(1)}
const ser=()=>JSON.stringify({o:objs.map(({geo,...r})=>r),nid,cnt});
const STORAGE_KEY='diedrico-2d-3d-v1';
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,ser())}catch(e){msg='No se pudo guardar el progreso en este navegador.'}}
function snap(){hist.push(ser());if(hist.length>80)hist.shift();fut=[]}
function load(s){const d=JSON.parse(s);objs=d.o;nid=d.nid;cnt=d.cnt;if(!byId(sel))sel=null;pending=[];compute();render(1)}
function undo(){if(!hist.length)return;fut.push(ser());load(hist.pop())}
function redo(){if(!fut.length)return;hist.push(ser());load(fut.pop())}

const CONS={
 // --- Punto ---
 mid:{n:'Punto medio de dos puntos',a:'pt',b:'pt',k:'pt'},
 symp:{n:'Simétrico de un punto respecto de otro (centro)',a:'pt',b:'pt',k:'pt'},
 inter:{n:'Intersección de una recta y un plano',a:'ln',b:'pl',k:'pt'},
 proj:{n:'Proyección de un punto sobre un plano',a:'pt',b:'pl',k:'pt'},
 projl:{n:'Proyección de un punto sobre una recta',a:'pt',b:'ln',k:'pt'},
 // --- Recta ---
 l2:{n:'Por dos puntos',a:'pt',b:'pt',k:'ln'},
 lpar:{n:'Paralela a una recta, por un punto',a:'pt',b:'ln',k:'ln'},
 lperp:{n:'Perpendicular a un plano, por un punto',a:'pt',b:'pl',k:'ln'},
 llt:{n:'Paralela a la LT (fronto-horizontal), por un punto',a:'pt',k:'ln'},
 lvert:{n:'Vertical, por un punto',a:'pt',k:'ln'},
 lpunta:{n:'De punta, por un punto',a:'pt',k:'ln'},
 lhor:{n:'Horizontal, por dos puntos (misma cota)',a:'pt',b:'pt',k:'ln'},
 lfront:{n:'Frontal, por dos puntos (mismo alejamiento)',a:'pt',b:'pt',k:'ln'},
 lperf:{n:'De perfil, por dos puntos (misma abscisa)',a:'pt',b:'pt',k:'ln'},
 pp2:{n:'Intersección de dos planos',a:'pl',b:'pl',k:'ln'},
 // --- Plano ---
 p3:{n:'Por tres puntos',a:'pt',b:'pt',c:'pt',k:'pl'},
 pl_lp:{n:'Que contiene una recta y pasa por un punto',a:'ln',b:'pt',k:'pl'},
 pl_ll:{n:'Que contiene dos rectas (paralelas o que se cortan)',a:'ln',b:'ln',k:'pl'},
 pperp:{n:'Perpendicular a una recta, por un punto',a:'pt',b:'ln',k:'pl'},
 ppar:{n:'Paralelo a otro plano, por un punto',a:'pt',b:'pl',k:'pl'},
 pltl_pp:{n:'Paralelo a la LT, por dos puntos',a:'pt',b:'pt',k:'pl'},
 pltl_pl:{n:'Paralelo a la LT, que contiene una recta',a:'ln',k:'pl'},
 phor:{n:'Horizontal, por un punto',a:'pt',k:'pl'},
 pfront:{n:'Frontal, por un punto',a:'pt',k:'pl'},
 pperf:{n:'De perfil, por un punto',a:'pt',k:'pl'},
 bis1:{n:'1.er bisector (y = z)',k:'pl'},
 bis2:{n:'2.º bisector (y = −z)',k:'pl'}};
const nm=(o,i)=>{const r=byId(o.refs[i]);return r?r.name:'?'};
const DESC={free:o=>'punto',mid:o=>`medio de ${nm(o,0)}${nm(o,1)}`,symp:o=>`simétrico de ${nm(o,0)} resp. de ${nm(o,1)}`,inter:o=>`${nm(o,0)} ∩ ${nm(o,1)}`,
 proj:o=>`proy. de ${nm(o,0)} sobre ${nm(o,1)}`,projl:o=>`proy. de ${nm(o,0)} sobre ${nm(o,1)}`,l2:o=>`recta ${nm(o,0)}${nm(o,1)}`,
 lpar:o=>`por ${nm(o,0)} ∥ ${nm(o,1)}`,lperp:o=>`por ${nm(o,0)} ⟂ ${nm(o,1)}`,llt:o=>`por ${nm(o,0)} ∥ LT`,lvert:o=>`vertical por ${nm(o,0)}`,lpunta:o=>`de punta por ${nm(o,0)}`,
 lhor:o=>`horizontal ${nm(o,0)}${nm(o,1)}`,lfront:o=>`frontal ${nm(o,0)}${nm(o,1)}`,lperf:o=>`de perfil ${nm(o,0)}${nm(o,1)}`,
 pp2:o=>`${nm(o,0)} ∩ ${nm(o,1)}`,p3:o=>`plano ${nm(o,0)}${nm(o,1)}${nm(o,2)}`,pl_lp:o=>`por ${nm(o,0)} y ${nm(o,1)}`,pl_ll:o=>`por ${nm(o,0)} y ${nm(o,1)}`,
 pperp:o=>`⟂ ${nm(o,1)} por ${nm(o,0)}`,ppar:o=>`∥ ${nm(o,1)} por ${nm(o,0)}`,pltl_pp:o=>`∥ LT por ${nm(o,0)}${nm(o,1)}`,pltl_pl:o=>`∥ LT que contiene ${nm(o,0)}`,
 phor:o=>`horizontal por ${nm(o,0)}`,pfront:o=>`frontal por ${nm(o,0)}`,pperf:o=>`de perfil por ${nm(o,0)}`,bis1:o=>'1.er bisector',bis2:o=>'2.º bisector'};
const desc=o=>o.kind==='pt'?`(${fmt(o.geo[0])}, ${fmt(o.geo[1])}, ${fmt(o.geo[2])})`:DESC[o.t](o);
const info=o=>o.kind==='pt'?`x=${f2(o.geo[0])} · y=${f2(o.geo[1])} · z=${f2(o.geo[2])}`:o.kind==='ln'?`Dirección (${o.geo.d.map(f2)})`:`Normal (${o.geo.n.map(f2)}) · n·X = ${f2(dot(o.geo.n,o.geo.p))}`;

/* ---------- 2D (SVG) ---------- */
const svg=$('#svg');
const X=x=>V.ox+x*V.s,YA=z=>V.oy-z*V.s,YP=y=>V.oy+y*V.s;
function draw2d(){
 const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
 if(!V.init){V.ox=W/2;V.oy=H/2;V.init=1}
 let g=10*V.s;while(g<14)g*=2;let d='';
 for(let x=(V.ox%g+g)%g;x<W;x+=g)d+=`M${x} 0V${H}`;for(let y=(V.oy%g+g)%g;y<H;y+=g)d+=`M0 ${y}H${W}`;

function setTool(t){tool=t;pending=[];msg='';document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));svg.className.baseVal=t==='sel'?'t-sel':'t-add';render(0)}
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(document.activeElement.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}
 else if(k==='v')setTool('sel');else if(k==='p')setTool('pt');else if(k==='r')setTool('ln');else if(k==='l')setTool('pl');
 else if(k==='escape'){setTool('sel');setTool3('orbit')}else if((k==='delete'||k==='backspace')&&sel)del(sel)});
function hint(){if(msg)return msg;return{sel:'Creado por Álvaro Gómez',
 pt:'Clic en el alzado (arriba) o la planta (abajo) para crear un punto; luego arrástralo en la otra vista para fijar su otra coordenada.',
 ln:`Recta: elige el punto ${pending.length+1} de 2 (clic en un punto existente o en un hueco para crear uno).`,
 pl:`Plano: elige el punto ${pending.length+1} de 3 (clic en un punto existente o en un hueco para crear uno).`}[tool]}
function hint3(){return{pt3:'Espacio 3D: clic sobre el plano PH para crear un punto (parte con z=0; luego ajusta su cota en Propiedades).',
 ln3:`Espacio 3D: elige el punto ${pending3.length+1} de 2 (clic en una esfera existente o en el plano para crear uno nuevo).`}[tool3]}
function render(full){draw2d();buildScene();if(full)panel();saveProgress();$('#st').textContent=hint3()||hint()}
